<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tyler's Wheels 🎡</title>
  <style>
    :root {
      --fun-color: #e74c3c;
      --meals-color: #2ecc71;
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --card-border: #0f3460;
      --text: #eaeaea;
      --subtext: #a0a0b0;
      --accent-fun: #ff6b6b;
      --accent-meals: #6bcb77;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 24px 0 12px;
    }
    header h1 {
      font-size: 2.4rem;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent-fun), var(--accent-meals));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--subtext);
      margin-top: 6px;
      font-size: 1rem;
    }

    .wheels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 32px;
      max-width: 1100px;
      margin: 32px auto 0;
    }

    .wheel-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .wheel-card h2 {
      font-size: 1.5rem;
      letter-spacing: 1px;
    }
    .wheel-card.fun h2  { color: var(--accent-fun); }
    .wheel-card.meals h2 { color: var(--accent-meals); }

    /* Canvas wheel */
    .wheel-wrap {
      position: relative;
      width: 300px;
      height: 300px;
    }
    .wheel-wrap canvas {
      border-radius: 50%;
      display: block;
    }
    /* Arrow pointer */
    .wheel-wrap::after {
      content: '';
      position: absolute;
      top: 50%;
      right: -18px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-right: 28px solid #fff;
      filter: drop-shadow(0 0 4px rgba(0,0,0,.6));
    }

    .spin-btn {
      padding: 10px 36px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
    }
    .spin-btn:active { transform: scale(0.96); }
    .wheel-card.fun  .spin-btn {
      background: var(--accent-fun);
      color: #fff;
      box-shadow: 0 4px 18px rgba(231,76,60,.4);
    }
    .wheel-card.meals .spin-btn {
      background: var(--accent-meals);
      color: #1a1a2e;
      box-shadow: 0 4px 18px rgba(46,204,113,.4);
    }
    .spin-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .result-display {
      min-height: 34px;
      font-size: 1.15rem;
      font-weight: 600;
      text-align: center;
      color: #fff;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 6px 16px;
      width: 100%;
    }

    /* Items management */
    .items-section {
      width: 100%;
    }
    .items-section h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--subtext);
      margin-bottom: 8px;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .add-form input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--card-border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-form input:focus { border-color: var(--accent-fun); }
    .wheel-card.meals .add-form input:focus { border-color: var(--accent-meals); }

    .add-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .wheel-card.fun  .add-btn { background: var(--accent-fun); color: #fff; }
    .wheel-card.meals .add-btn { background: var(--accent-meals); color: #1a1a2e; }

    .items-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 4px;
    }
    .items-list::-webkit-scrollbar { width: 5px; }
    .items-list::-webkit-scrollbar-track { background: transparent; }
    .items-list::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.9rem;
    }
    .item-row span { flex: 1; }
    .del-btn {
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s;
      line-height: 1;
    }
    .del-btn:hover { background: rgba(231,76,60,.18); }

    .empty-msg {
      text-align: center;
      color: var(--subtext);
      font-size: 0.88rem;
      padding: 10px 0;
    }

    /* Result modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 18px;
      padding: 36px 48px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      animation: pop 0.25s ease;
    }
    @keyframes pop {
      from { transform: scale(0.75); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .modal-box .modal-emoji { font-size: 3rem; }
    .modal-box h2 { margin: 12px 0 6px; font-size: 1.3rem; color: var(--subtext); }
    .modal-box .modal-result { font-size: 1.9rem; font-weight: 700; margin-bottom: 20px; }
    .modal-box.fun   .modal-result { color: var(--accent-fun); }
    .modal-box.meals .modal-result { color: var(--accent-meals); }
    .modal-close {
      padding: 10px 32px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--card-border);
      color: var(--text);
    }
    .modal-close:hover { background: #1a3a6e; }

    @media (max-width: 480px) {
      header h1 { font-size: 1.7rem; }
      .wheel-wrap { width: 240px; height: 240px; }
    }
  </style>
</head>
<body>

<header>
  <h1>🎡 Tyler's Wheels 🍽️</h1>
  <p>Spin to decide — weekend fun &amp; what's for dinner!</p>
</header>

<div class="wheels-grid">
  <!-- Wheel of Fun -->
  <div class="wheel-card fun" id="card-fun">
    <h2>🎉 Wheel of Fun</h2>
    <div class="wheel-wrap">
      <canvas id="canvas-fun" width="300" height="300"></canvas>
    </div>
    <button class="spin-btn" id="spin-fun">SPIN!</button>
    <div class="result-display" id="result-fun">Spin to reveal your activity!</div>
    <div class="items-section">
      <h3>Activities</h3>
      <div class="add-form">
        <input type="text" id="input-fun" placeholder="Add an activity…" maxlength="100" />
        <button class="add-btn" id="add-fun">＋</button>
      </div>
      <ul class="items-list" id="list-fun"></ul>
    </div>
  </div>

  <!-- Wheel of Meals -->
  <div class="wheel-card meals" id="card-meals">
    <h2>🍽️ Wheel of Meals</h2>
    <div class="wheel-wrap">
      <canvas id="canvas-meals" width="300" height="300"></canvas>
    </div>
    <button class="spin-btn" id="spin-meals">SPIN!</button>
    <div class="result-display" id="result-meals">Spin to pick tonight's meal!</div>
    <div class="items-section">
      <h3>Meal Ideas</h3>
      <div class="add-form">
        <input type="text" id="input-meals" placeholder="Add a meal…" maxlength="100" />
        <button class="add-btn" id="add-meals">＋</button>
      </div>
      <ul class="items-list" id="list-meals"></ul>
    </div>
  </div>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" id="modal-box">
    <div class="modal-emoji" id="modal-emoji"></div>
    <h2 id="modal-title"></h2>
    <div class="modal-result" id="modal-result"></div>
    <button class="modal-close" id="modal-close">Awesome!</button>
  </div>
</div>

<script>
// ─── Palette ────────────────────────────────────────────────────────────────
const FUN_COLORS   = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#ff5722','#00bcd4','#8bc34a','#ff9800'];
const MEALS_COLORS = ['#2ecc71','#27ae60','#1abc9c','#16a085','#3498db','#2980b9','#9b59b6','#8e44ad','#f39c12','#e67e22','#e74c3c','#c0392b'];

// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  fun:   { items: [], spinning: false, currentAngle: 0 },
  meals: { items: [], spinning: false, currentAngle: 0 },
};

// ─── Canvas helpers ──────────────────────────────────────────────────────────
function drawWheel(wheel) {
  const { items, currentAngle } = state[wheel];
  const canvas = document.getElementById(`canvas-${wheel}`);
  const ctx    = canvas.getContext('2d');
  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;
  const r  = cx - 4;
  const palette = wheel === 'fun' ? FUN_COLORS : MEALS_COLORS;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (items.length === 0) {
    // Empty wheel placeholder
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#1e2a40';
    ctx.fill();
    ctx.strokeStyle = '#0f3460';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#a0a0b0';
    ctx.font = 'bold 15px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Add items below!', cx, cy);
    return;
  }

  const slice = (Math.PI * 2) / items.length;

  items.forEach((item, i) => {
    const start = currentAngle + i * slice;
    const end   = start + slice;

    // Slice fill
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = palette[i % palette.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + slice / 2);
    ctx.textAlign  = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle  = '#fff';
    const fontSize = items.length > 10 ? 11 : items.length > 7 ? 13 : 15;
    ctx.font = `bold ${fontSize}px Segoe UI, sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur  = 3;
    // Truncate long labels
    let label = item.label;
    if (label.length > 14) label = label.slice(0, 13) + '…';
    ctx.fillText(label, r - 10, 0);
    ctx.restore();
  });

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 18, 0, Math.PI * 2);
  ctx.fillStyle = '#1a1a2e';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ─── Spin logic ──────────────────────────────────────────────────────────────
function spin(wheel) {
  const s = state[wheel];
  if (s.spinning || s.items.length === 0) return;
  s.spinning = true;

  const spinBtn = document.getElementById(`spin-${wheel}`);
  spinBtn.disabled = true;

  // Random total rotation: 5–10 full turns plus a random extra
  const extraAngle = Math.random() * Math.PI * 2;
  const totalRotation = (5 + Math.random() * 5) * Math.PI * 2 + extraAngle;
  const duration = 4000 + Math.random() * 2000; // 4–6 s
  const startAngle = s.currentAngle;
  const startTime  = performance.now();

  function easeOut(t) {
    // Cubic ease-out
    return 1 - Math.pow(1 - t, 3);
  }

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    s.currentAngle = startAngle + totalRotation * easeOut(progress);
    drawWheel(wheel);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      s.spinning = false;
      spinBtn.disabled = false;
      showResult(wheel);
    }
  }

  requestAnimationFrame(animate);
}

function showResult(wheel) {
  const s = state[wheel];
  if (s.items.length === 0) return;

  const slice = (Math.PI * 2) / s.items.length;
  // The pointer is on the right side (angle = 0 in canvas coords means right).
  // We normalise the current angle to find which segment is under the pointer.
  const normalised = ((s.currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  // Pointer is at angle 0 (pointing right). Find segment:
  const idx = Math.floor(((Math.PI * 2 - normalised) % (Math.PI * 2)) / slice) % s.items.length;
  const winner = s.items[idx].label;

  // Update inline result
  const resultEl = document.getElementById(`result-${wheel}`);
  resultEl.textContent = `🎉 ${winner}`;

  // Show modal
  const modal     = document.getElementById('modal');
  const modalBox  = document.getElementById('modal-box');
  const emoji     = document.getElementById('modal-emoji');
  const title     = document.getElementById('modal-title');
  const resultDiv = document.getElementById('modal-result');

  modalBox.className = `modal-box ${wheel}`;
  emoji.textContent  = wheel === 'fun' ? '🎉' : '🍽️';
  title.textContent  = wheel === 'fun' ? 'Weekend Activity:' : "Tonight's Meal:";
  resultDiv.textContent = winner;
  modal.classList.add('show');
}

// ─── List rendering ──────────────────────────────────────────────────────────
function renderList(wheel) {
  const list = document.getElementById(`list-${wheel}`);
  const { items } = state[wheel];
  list.innerHTML = '';
  if (items.length === 0) {
    list.innerHTML = '<li class="empty-msg">No items yet. Add some above!</li>';
    drawWheel(wheel);
    return;
  }
  items.forEach((item) => {
    const li = document.createElement('li');
    li.className = 'item-row';
    li.innerHTML = `
      <span>${escHtml(item.label)}</span>
      <button class="del-btn" aria-label="Remove ${escHtml(item.label)}" data-id="${item.id}" data-wheel="${wheel}">✕</button>
    `;
    list.appendChild(li);
  });
  drawWheel(wheel);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── API calls ───────────────────────────────────────────────────────────────
async function loadItems(wheel) {
  const res = await fetch(`/api/wheels/${wheel}`);
  state[wheel].items = await res.json();
  renderList(wheel);
}

async function addItem(wheel) {
  const input = document.getElementById(`input-${wheel}`);
  const label = input.value.trim();
  if (!label) return;
  const res = await fetch(`/api/wheels/${wheel}`, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ label }),
  });
  if (res.ok) {
    input.value = '';
    await loadItems(wheel);
  } else {
    const err = await res.json();
    alert(err.error || 'Failed to add item.');
  }
}

async function deleteItem(wheel, id) {
  await fetch(`/api/wheels/${wheel}/${id}`, { method: 'DELETE' });
  await loadItems(wheel);
}

// ─── Event wiring ────────────────────────────────────────────────────────────
['fun', 'meals'].forEach((wheel) => {
  document.getElementById(`spin-${wheel}`).addEventListener('click', () => spin(wheel));

  document.getElementById(`add-${wheel}`).addEventListener('click', () => addItem(wheel));

  document.getElementById(`input-${wheel}`).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addItem(wheel);
  });

  document.getElementById(`list-${wheel}`).addEventListener('click', (e) => {
    const btn = e.target.closest('.del-btn');
    if (btn) deleteItem(btn.dataset.wheel, btn.dataset.id);
  });
});

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
});
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('show');
  }
});

// ─── Init ────────────────────────────────────────────────────────────────────
loadItems('fun');
loadItems('meals');
</script>
</body>
</html>
